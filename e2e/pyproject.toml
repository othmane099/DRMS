[project]
name = "drms_e2e"
version = "0.1.0"
description = "DRMS End-to-End Tests"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0",
    "playwright>=1.50.0",
    "pytest>=9.0.0",
    "pytest-playwright>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
base_url = "http://localhost:3000"