version: '3.8'

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://test:test123@postgres:5432/postgres
  REDIS_URL: redis://redis:6379
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  LOG_LEVEL: DEBUG
  UPLOAD_DIR: /app/uploads
  QDRANT_URL: http://qdrant:6333

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  qdrant:
    condition: service_started

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      <<: *backend-depends
    volumes:
      - uploaded_documents:/app/uploads
    environment:
      <<: *backend-env

  celery-worker:
    build: ./backend
    entrypoint: []
    command: celery -A src.celery_app worker --loglevel=info
    depends_on:
      <<: *backend-depends
    volumes:
      - uploaded_documents:/app/uploads
    environment:
      <<: *backend-env

  celery-beat:
    build: ./backend
    entrypoint: []
    command: celery -A src.celery_app beat --loglevel=info
    depends_on:
      <<: *backend-depends
    environment:
      <<: *backend-env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_documents:
  qdrant_data: