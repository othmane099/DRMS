http:
  routers:
    backend:
      rule: "Host(`api.localhost`)"
      entryPoints:
        - web
      service: backend
    frontend:
      rule: "Host(`localhost`)"
      entryPoints:
        - web
      service: frontend

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8000"
    frontend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"